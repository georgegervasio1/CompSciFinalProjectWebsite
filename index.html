<!DOCTYPE html>
<html>
<head>
    <title>Bridge Legal | Client Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1c1c1c;
        }

        header {
            background-color: #0b1f3a;
            color: white;
            padding: 25px 50px;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            background: white;
            padding: 50px;
            border-radius: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 600;
            color: #0b1f3a;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #333;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 30px;
            border-radius: 4px;
            border: 1px solid #d0d5db;
            font-size: 15px;
            background-color: #fafafa;
        }

        select:focus {
            outline: none;
            border-color: #0b1f3a;
        }

        .client-box {
            background-color: #f9fafc;
            padding: 25px;
            border-left: 4px solid #b89b5e;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            font-size: 12px;
            color: #777;
        }

    </style>
</head>

<body>

<header>
    BRIDGE LEGAL | CLIENT PORTAL
</header>

<div class="container">
    <h1>Select Client Record</h1>

    <label for="clientSelect">CLIENT ID</label>
    <select id="clientSelect">
        <option value="">-- Select Client --</option>
    </select>

    <div class="client-box" id="clientDisplay">
        Client information will appear here.
    </div>
</div>

<footer>
    © 2026 Bridge Legal. Confidential & Proprietary.
</footer>

<script>
fetch("clients.json")
    .then(response => response.json())
    .then(data => {
        const dropdown = document.getElementById("clientSelect");
        const display = document.getElementById("clientDisplay");

        const firstColumn = Object.keys(data[0])[0];

        data.forEach(client => {
            const option = document.createElement("option");
            option.value = client[firstColumn];
            option.textContent = client[firstColumn];
            dropdown.appendChild(option);
        });

        dropdown.addEventListener("change", function() {
            const selected = data.find(c => 
                c[firstColumn] == this.value
            );

            if (selected) {
                display.textContent = Object.entries(selected)
                    .map(([key, value]) => key + ": " + value)
                    .join("\n");
            } else {
                display.textContent = "Client information will appear here.";
            }
        });
    });
</script>

</body>
</html>
